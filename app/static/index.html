<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>P1 — Yolcu Deneyimi Asistanı (Dahili Konsol)</title>
<style>
  :root {
    --thy-red: #c8102e;
    --thy-dark: #0a1a2f;
    --bg: #f4f6f8;
    --panel: #ffffff;
    --border: #e1e5ea;
    --text: #1c2530;
    --muted: #6b7684;
    --user-bubble: #0a1a2f;
    --assistant-bubble: #eef1f4;
    --ok: #1a7f4b;
    --warn: #b06a00;
    --danger: #c8102e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--thy-dark);
    color: #fff;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  header .badge {
    font-size: 11px;
    background: var(--thy-red);
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 600;
  }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 16px;
    padding: 16px;
    min-height: 0;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .panel-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .panel-header .hint { font-weight: 400; color: var(--muted); font-size: 12px; }

  /* --- Sohbet --- */
  #chat-log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--user-bubble); color: #fff; border-bottom-right-radius: 2px; }
  .msg.assistant { align-self: flex-start; background: var(--assistant-bubble); border-bottom-left-radius: 2px; }
  .msg.assistant.blocked { background: #fdecec; border: 1px solid #f3b9c0; }
  .meta-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .tag { font-size: 10.5px; padding: 2px 8px; border-radius: 999px; background: #dfe6ec; color: var(--muted); font-weight: 600; }
  .tag.intent { background: #dbe9ff; color: #1a4a8a; }
  .tag.blocked { background: #fbdada; color: var(--danger); }
  .tag.clarify { background: #fff1cf; color: var(--warn); }
  .sources { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .sources ul { margin: 4px 0 0; padding-left: 16px; }

  #chat-form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }
  #chat-input {
    flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; font-family: inherit;
  }
  #chat-input:focus { outline: 2px solid var(--thy-dark); outline-offset: -1px; }
  button {
    background: var(--thy-dark); color: #fff; border: none; border-radius: 8px;
    padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary { background: transparent; color: var(--thy-dark); border: 1px solid var(--border); }

  /* --- Onay kuyruğu --- */
  #approvals-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .approval-card { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
  .approval-card .pnr { font-weight: 700; }
  .approval-card .action { color: var(--muted); font-size: 12px; }
  .approval-card .actions { display: flex; gap: 6px; margin-top: 8px; }
  .approval-card .actions button { flex: 1; padding: 6px 10px; font-size: 12.5px; }
  .approval-card .actions button.reject { background: transparent; color: var(--danger); border: 1px solid #f3b9c0; }
  .approval-card .actions button.approve { background: var(--ok); }
  .empty-state { color: var(--muted); font-size: 13px; text-align: center; padding: 24px 12px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--thy-dark); color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity 0.25s; pointer-events: none; }
  .toast.show { opacity: 1; }

  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>P1 — Yolcu Deneyimi Asistanı · Dahili Konsol</h1>
  <span class="badge">bağımsız portföy / iç kullanım demosu</span>
</header>

<main>
  <section class="panel">
    <div class="panel-header">
      Sohbet
      <span class="hint">/chat uç noktasına gerçek istek gönderir</span>
    </div>
    <div id="chat-log"></div>
    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="Bir soru yazın… (örn. Business class bagaj hakkım nedir?)" autocomplete="off" />
      <button type="submit" id="send-btn">Gönder</button>
    </form>
  </section>

  <section class="panel">
    <div class="panel-header">
      Onay Bekleyen İşlemler
      <button class="secondary" id="refresh-approvals" style="padding:4px 10px;font-size:12px;">Yenile</button>
    </div>
    <div id="approvals-list"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const chatLog = document.getElementById('chat-log');
const chatForm = document.getElementById('chat-form');
const chatInput = document.getElementById('chat-input');
const sendBtn = document.getElementById('send-btn');
const approvalsList = document.getElementById('approvals-list');
const toastEl = document.getElementById('toast');
let sessionId = null; // ilk mesajda bos, sunucunun donduruguyle sonraki mesajlarda tasinir

function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2200);
}

function addMessage(role, text, meta) {
  const el = document.createElement('div');
  el.className = 'msg ' + role + (meta && meta.blocked ? ' blocked' : '');
  el.textContent = text;

  if (meta) {
    const row = document.createElement('div');
    row.className = 'meta-row';
    if (meta.intent) {
      const t = document.createElement('span');
      t.className = 'tag intent';
      t.textContent = meta.intent;
      row.appendChild(t);
    }
    if (meta.blocked) {
      const t = document.createElement('span');
      t.className = 'tag blocked';
      t.textContent = 'bloklandı: ' + (meta.block_reason || 'guardrail');
      row.appendChild(t);
    }
    if (meta.needs_clarification) {
      const t = document.createElement('span');
      t.className = 'tag clarify';
      t.textContent = 'netleştirme gerekiyor';
      row.appendChild(t);
    }
    if (row.children.length) el.appendChild(row);

    if (meta.sources && meta.sources.length) {
      const src = document.createElement('div');
      src.className = 'sources';
      src.innerHTML = '<strong>Kaynaklar:</strong>';
      const ul = document.createElement('ul');
      meta.sources.forEach(s => {
        const li = document.createElement('li');
        li.textContent = `${s.source_file} — ${s.section_title} (skor: ${s.score.toFixed(2)})`;
        ul.appendChild(li);
      });
      src.appendChild(ul);
      el.appendChild(src);
    }
  }

  chatLog.appendChild(el);
  chatLog.scrollTop = chatLog.scrollHeight;
}

async function sendMessage(text) {
  addMessage('user', text);
  sendBtn.disabled = true;
  const thinking = document.createElement('div');
  thinking.className = 'msg assistant';
  thinking.textContent = '…';
  chatLog.appendChild(thinking);
  chatLog.scrollTop = chatLog.scrollHeight;

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: sessionId }),
    });
    const data = await res.json();
    thinking.remove();
    if (!res.ok) {
      addMessage('assistant', 'Hata: ' + (data.detail || res.status), { blocked: true });
    } else {
      sessionId = data.session_id;
      addMessage('assistant', data.message, data);
      if (data.intent === 'rezervasyon_islem_talebi') loadApprovals();
    }
  } catch (err) {
    thinking.remove();
    addMessage('assistant', 'Sunucuya ulaşılamadı: ' + err.message, { blocked: true });
  } finally {
    sendBtn.disabled = false;
  }
}

chatForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = chatInput.value.trim();
  if (!text) return;
  chatInput.value = '';
  sendMessage(text);
});

async function loadApprovals() {
  approvalsList.innerHTML = '<div class="empty-state">Yükleniyor…</div>';
  try {
    const res = await fetch('/approvals/pending');
    const items = await res.json();
    if (!items.length) {
      approvalsList.innerHTML = '<div class="empty-state">Bekleyen onay talebi yok.</div>';
      return;
    }
    approvalsList.innerHTML = '';
    items.forEach(renderApprovalCard);
  } catch (err) {
    approvalsList.innerHTML = '<div class="empty-state">Yüklenemedi: ' + err.message + '</div>';
  }
}

function renderApprovalCard(item) {
  const card = document.createElement('div');
  card.className = 'approval-card';
  const actionLabel = { cancel: 'İptal', change_date: 'Tarih değişikliği' }[item.action] || item.action;
  const detail = item.action === 'change_date' ? ` → ${item.payload.new_date}` : '';
  card.innerHTML = `
    <div class="pnr">${item.pnr}</div>
    <div class="action">${actionLabel}${detail} · talep no: ${item.id}</div>
    <div class="actions">
      <button class="approve">Onayla</button>
      <button class="reject">Reddet</button>
    </div>
  `;
  card.querySelector('.approve').addEventListener('click', () => decide(item.id, 'approve'));
  card.querySelector('.reject').addEventListener('click', () => decide(item.id, 'reject'));
  approvalsList.appendChild(card);
}

async function decide(id, action) {
  try {
    const res = await fetch(`/approvals/${id}/${action}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: action === 'reject' ? JSON.stringify({ reason: 'Konsoldan reddedildi' }) : undefined,
    });
    const data = await res.json();
    if (!res.ok) {
      showToast('Hata: ' + (data.detail || res.status));
    } else {
      showToast(action === 'approve' ? 'Onaylandı: ' + id : 'Reddedildi: ' + id);
    }
  } catch (err) {
    showToast('İstek başarısız: ' + err.message);
  }
  loadApprovals();
}

document.getElementById('refresh-approvals').addEventListener('click', loadApprovals);

addMessage('assistant', 'Merhaba, ben P1 yolcu deneyimi asistanıyım. Bagaj, uçuş durumu, check-in ya da rezervasyon konularında yardımcı olabilirim.');
loadApprovals();
</script>

</body>
</html>
